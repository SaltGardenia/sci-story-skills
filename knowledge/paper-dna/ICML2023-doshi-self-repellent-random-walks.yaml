# thesis: This paper shows that a random walk's sampling variance on graphs can be driven
# below even that of an i.i.d. sampler because transition probabilities can be made a
# decreasing function of the walk's own occupational measure (a nonlinear Markov chain),
# and therefore proposes the Self-Repellent Random Walk (SRRW), whose asymptotic covariance
# provably decreases in the repellence parameter α (Loewner order, O(1/α) speed, → 0).
paper:
  venue: ICML
  year: 2023
  field: stochastic processes / MCMC on graphs
  task: variance reduction for random-walk-based sampling (MCMC, unbiased graph sampling) over general graphs
  problem: "random walkers must \"approximate a target quantity over the network topology via sampling\" but classic Markov chains are \"victims of limitations set by the underlying topology,\" producing correlated samples that hurt estimator performance (abstract; §1)"
  importance: random-walk samplers scale and implement robustly on large graphs because transitions need only local information, so improving their efficiency transfers directly to MCMC, graph sampling, and distributed optimization (§1)
  source: full
paradigm:
  existing_approach: time-reversible Markov chain MCMC (Metropolis-Hastings random walk) and non-reversible/non-backtracking variants that avoid only the most recently visited states (§1 Related Works)
  core_assumption: the walker's transition kernel must be a (linear) Markov kernel, independent of history — or, at most, depend on the single most recent step (non-backtracking)
  limitation: "non-backtracking methods \"only utilize the most recent history\"; weakly self-avoiding walk literature studies lattices and recurrence/escape properties, not convergence of statistical estimators on general graphs (§1)"
gap:
  unresolved_problem: design a self-repelling protocol where the walker interacts with its *entire* past history, with provable convergence to the target measure and quantified sampling-efficiency gains on general graphs (§1)
  evidence_for_gap: logical + citation-pattern — prior self-repelling analyses don't yield algorithmic guarantees for estimator convergence on general topologies (§1 Related Works)
insight:
  observation: non-backtracking walks that interact with (a sliver of) their own history are provably more efficient than their base chains (Neal 2004, Lee et al. 2012, cited §1)
  central_insight: make the transition probability to node j proportional to r_µj([x_n]_j), a *decreasing* function of j's visit frequency with r_µi(µ_i) = constant — then the empirical distribution is governed by a nonlinear Markov chain whose stationary point is exactly the target µ, and whose fluctuation matrix can be computed in closed form (§1 kernel (1); §4)
  hypothesis: analyzed as stochastic approximation with state-dependent Markovian noise, the SRRW converges a.s. to µ and its asymptotic covariance V(α) satisfies a Loewner ordering in α — stronger repellence is never worse (§4)
method:
  conceptual_change: replace the linear Markov kernel with a *nonlinear* kernel whose argument is the walk's own occupational measure — history enters multiplicatively rather than by exclusion
  mechanism: SRRW kernel K_ij[x] = P_ij r_µj(x_j) / Σ_k P_ik r_µk(x_k) with polynomial self-repellence r_µi(x_i) = (x_i/µ_i)^{−α}; α=0 recovers the base chain; scale-invariance (S.I.) keeps it implementable with only local, constant-factor knowledge of µ — and the polynomial form is the *unique* rµi with S.I. (Eq. 1, 3; §1; App. D)
  formulation: occupational measure x_n = (1/(n+1)) Σ δ_{X_k} (Eq. 2); CLT √n(x_n − µ) → N(0, V(α)) with V(α) exact in terms of the spectrum of P (Thm 4.2, §4); MCMC estimator variance ratio gᵀV(α)g / gᵀV(0)g ≤ E[1/(2α(1+Λ)+1)] (Cor. 4.7, Eq. 18)
claims:
  - id: C1
    claim: the SRRW's empirical distribution converges almost surely to the target distribution µ for all α ≥ 0 (abstract; Eq. 4)
    importance: central
    evidence: theoretical — ODE/Lyapunov analysis + stochastic approximation (§3, §4; Thm 4.1), under stability assumption (A1)
  - id: C2
    claim: "a CLT holds with exact asymptotic covariance V(α), and \"the SRRW with a stronger repellence (larger α) always achieves a smaller asymptotic covariance, in the sense of Loewner ordering\" (abstract; §4)"
    importance: central
    evidence: theoretical — Theorem 4.2, Corollary 4.3 (V(α) in terms of eigen-decomposition of P)
  - id: C3
    claim: "for SRRW-driven MCMC, \"the decrease in the asymptotic sampling variance is of the order O(1/α), eventually going down to zero\" — so for large enough α the SRRW asymptotically beats even an i.i.d. sampler (abstract; §4 after Cor. 4.7)"
    importance: central
    evidence: theoretical — Corollary 4.7 (Eq. 18) + crossover argument against Var(g(Y)) of an i.i.d. sample
  - id: C4
    claim: time-varying α (sigmoid schedules) combines fast early mixing of small α with the asymptotic efficiency of large α (§1 contribution 3; §5)
    importance: supporting
    evidence: empirical — Fig. 1 (MSE curves for sigmoid-1/sigmoid-2 beating fixed α = 2)
experiments:
  - id: E1
    research_question: RQ5 — do the predicted convergence and variance orderings hold numerically?
    setup: wiki-Vote graph (889 nodes, 2914 edges), base chain = Metropolis-Hastings RW targeting uniform µ; TVD of x_n and MSE of the average-degree estimator, averaged over K=500 runs; α ∈ [0, 2] fixed plus time-varying sigmoids (§5, Fig. 1)
    baseline: α = 0, i.e. the plain MHRW
    result: "larger α performs better asymptotically for both TVD and MSE, \"significantly outperforming\" α=0; time-varying α best in MSE (§5, Fig. 1a–b)"
    interpretation: theory's ordering is visible at practical sample sizes; α-annealing is a promising adaptive extension beyond the proven constant-α framework (§5)
    supported_claim: C1, C2, C4
narrative:
  introduction_roles: [Context (random walks as samplers), Failure mode (topology-induced correlation), Related approach (non-reversible/non-backtracking), Gap (history beyond one step, general graphs), Solution (SRRW), Contributions (numbered 1–3)]
  introduction_move: escalates history-dependence step by step — none → most recent step → entire history — so the method reads as the natural endpoint of an existing trend; contributions are stated as three theory items plus simulations, with no empirical teaser
  related_work_strategy: "two-axis contrast — self-avoiding walk literature (wrong questions: recurrence/escape) and interacting-particle repellence (wrong object: multiple particles); positions SRRW as single-walker, estimator-focused"
  method_strategy: formulation-first — the kernel equation (1) is displayed in the introduction before any analysis; theory carried by stochastic-approximation machinery (ODE + Lyapunov) rather than new technique
  experiments_strategy: "single well-known graph, one estimator, theory-predicted orderings as the claim being verified; time-varying α introduced as an empirical bonus explicitly outside the theory (\"our theoretical framework only supports constant values of α\", §5)"
  conclusion_strategy: "recap of the Lyapunov→SA→CLT pipeline, then a field-building call: \"advocate[s] for study into the design of nonlinear Markov chains for MCMC and other learning applications\" (§6)"
reviewer_defense:
  strengths: exact covariance characterization (not just bounds) is rare; Loewner ordering gives a parameter-tuning guarantee that is assumption-free in direction; scale-invariance makes deployment as easy as MHRW
  vulnerabilities: "almost-sure convergence requires stability assumption (A1) whose formal proof \"remains an open problem\" (Remark 4.5); finite-time/mixing behavior of large α is bad and only patched empirically via time-varying α; simulations limited to one graph"
  anticipated_attacks: "\"nonlinear chains are hard to analyze\" — the paper itself is the analysis, via SA with state-dependent Markovian noise (§1, §4); \"large α mixes slowly\" — conceded and mitigated with sigmoid schedules (§5, Fig. 1); \"why polynomial rµi?\" — uniqueness under scale-invariance (App. D)"
writing:
  paragraph_patterns: "contribution list with (1) convergence, (2) covariance ordering, (3) simulations — each item a theorem-level sentence; long \"Related Works\" paragraph inside the introduction distinguishing neighbors precisely"
  transition_patterns: "\"While these methods only utilize the most recent history ... it is natural to consider...\" — gap sentence pattern; assumption (A1) introduced with an honest Remark 4.5 about its open status"
  terminology_patterns: "acronym discipline (SRRW, SIMC, S.I., MHRW, TVD, MSE); α always glossed as \"strength of self-repellence\"; nonlinear-Markov-chain vocabulary imported from Andrieu/Del Moral"

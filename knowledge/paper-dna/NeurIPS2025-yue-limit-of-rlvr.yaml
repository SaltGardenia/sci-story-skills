# thesis: This paper shows that current RLVR does not elicit reasoning beyond the base model —
# base models surpass RLVR models at large k in pass@k and RLVR-generated reasoning paths are
# already present in the base model's sampling distribution — and therefore argues RLVR mainly
# sharpens sampling efficiency, calling for new RL paradigms (exploration, curricula, process
# rewards, agentic interaction) to genuinely expand reasoning capacity.
paper:
  venue: NeurIPS
  year: 2025
  field: LLM reasoning / RLVR analysis
  task: assessing whether RL with verifiable rewards expands or merely sharpens LLM reasoning
  problem: '"Does current RLVR genuinely enable LLMs to acquire novel reasoning abilities–similar to how traditional RL discovers new strategies through exploration–or does it simply utilize reasoning patterns already in the base model?" (§1)'
  importance: RLVR (o1, DeepSeek-R1, Kimi-1.5) is "widely believed" to enable continuous self-improvement toward "more powerful intelligence"; if that belief is wrong, the field's roadmap changes (§1)
  source: full

paradigm:
  existing_approach: RLVR — optimize a base model with RL against automatically verifiable rewards (PPO/GRPO/DAPO etc.), extrapolating from traditional RL successes (Atari, Go) where agents surpass priors through exploration (§1, §2.1)
  core_assumption: '"similar to how traditional RL helps agents to explore and learn new strategies, RLVR enables LLMs to continuously self-improve, thus acquiring novel reasoning abilities that exceed the capacity of the corresponding base models" (abstract)'
  limitation: average-score metrics (greedy/nucleus pass@1) confound sampling efficiency with capability; "these metrics risk underestimating the true potential of a model" (§1)

gap:
  unresolved_problem: measure the reasoning capability boundary of base vs RLVR models and determine whether RLVR's gains come from new patterns or reweighting of old ones
  evidence_for_gap: 'methodological — no prior systematic pass@k-at-large-k comparison across families/algorithms/domains (§6: prior observations by Dang et al., DeepSeek-Math were "limited in scope", single models/benchmarks)'

insight:
  observation: pass@k curves cross — RLVR models win at small k but base models "consistently catch up to and eventually surpass" them at large k across all benchmarks and families (§3.1, Fig. 2); accuracy histograms show RLVR raises frequency near 1.0 but also increases the frequency of accuracy-0 problems (§4.1, Fig. 5)
  central_insight: 'RLVR''s effect is distributional sharpening within the base model''s prior — "the reasoning paths generated by RLVR models are already included in the base models'' sampling distribution" (abstract); the pretrained prior is a double-edged sword in the vast action space: deviation from it yields invalid outputs and negative reward, so policy gradients push probability mass onto prior paths (§5, Discussion 2)'
  hypothesis: if this is right, (i) solvable sets of RLVR models should be near-subsets of base models' solvable sets, (ii) PPL_base(Y_RL) should sit inside PPL_base(Y_base)'s low tail, (iii) no RLVR algorithm should escape the pattern, and (iv) distillation from a stronger teacher — which injects a new prior — should expand the boundary (§4.1–4.3)

method:
  conceptual_change: evaluate capability as coverage (pass@k at large k, i.e., what a model can potentially solve) rather than average-case accuracy — pass@k "provides a rigorous evaluation of the reasoning capacity coverage of LLMs" (§2.2)
  mechanism: measurement + falsification design — pass@k with unbiased low-variance estimator across model families (Qwen2.5 7B/14B/32B, LLaMA-3.1-8B), domains (math/code/visual), and six RL algorithms; then accuracy histograms, solvable-set contingency tables, and cross-model perplexity analysis to locate the mechanism; ΔSE (RL pass@1 vs base pass@256) to compare algorithms (§2.2, §4.1, §4.3, Table 1)
  formulation: pass@k per §2.2 (estimator §A.2); PPL_m(Y|x) = exp(−(1/T)Σ log P(y_t|x,y_<t)) (§4.1); ΔSE = RL pass@1 − base pass@256 (§4.3); controlled training with six algorithms (PPO, GRPO, Reinforce++, RLOO, ReMax, DAPO) in VeRL on identical data (Table 1)

claims:
  - id: C1
    claim: '"base models consistently surpass RLVR models across all benchmarks and LLM families as k increases" — comparative'
    importance: central
    evidence: '§3.1 Fig. 2 (e.g., Minerva 32B: base +~9% at k=128); Fig. 3 code; Fig. 4 visual; Oat-Zero/DAPO surpass at large k despite ~30% initial lead (Fig. 11)'
  - id: C2
    claim: '"reasoning paths generated by current RLVR model already exist in its base model" — mechanistic (perplexity + coverage evidence)'
    importance: central
    evidence: '§4.1 — PPL_base(Y_RL) matches the lower portion of PPL_base(Y_base); PPL_base(Y_RL) decreases as RL training progresses (Fig. 6, App. C.4); solvable-set analysis Table 2 (AIME24: base-solves-RL-fails 13.3% vs RL-solves-base-fails 0.0%; MATH500 3.6% vs 1.0%)'
  - id: C3
    claim: '"RLVR leads to more unsolvable problems" — accuracy-0 frequency rises even as near-1.0 frequency rises — descriptive'
    importance: central
    evidence: §4.1, Fig. 5 (Minerva histograms)
  - id: C4
    claim: six popular RLVR algorithms "perform similarly and remain far from optimal" in leveraging the base model (ΔSE large, minor variation) — comparative
    importance: supporting
    evidence: §4.3, Fig. 8
  - id: C5
    claim: distillation is fundamentally different — "distillation can introduce new reasoning patterns from the teacher and genuinely expand the model's reasoning capabilities"; distilled pass@k "consistently and significantly above that of the base model" — comparative
    importance: central
    evidence: §4.2, Fig. 7 (DeepSeek-R1-Distill-Qwen-7B vs Qwen2.5-Math-7B and its Oat-Zero RL variant)
  - id: C6
    claim: 'the limitation stems from vast action space + pretrained priors: exploration beyond the prior is punished by outcome rewards, so RLVR constrains rather than expands — explanatory/theoretical (discussion-level)'
    importance: supporting
    evidence: §5, Discussions 1–2; four future-work directions (high-level exploration, curriculum data scaling, process rewards, agentic RL)

experiments:
  - id: E1
    research_question: RQ4-mechanistic — does RLVR expand the solvable-problem boundary in mathematics?
    setup: pass@k up to k=1024/2048 on GSM8K, MATH500, Minerva, Olympiad, AIME24, AMC23; Qwen2.5 7/14/32B, LLaMA-3.1-8B; SimpleRLZoo GRPO zero-RL models, Oat-Zero, DAPO; temp 0.6/top-p 0.95, zero-shot prompts for both models (§3.1, Table 1, Figs. 2, 11)
    baseline: corresponding base models
    result: crossing pass@k curves; base +9% at k=128 (Minerva 32B); CoT validity manually checked (24/25 base-solvable GSM8K hard problems had genuine CoTs; AIME24 5/6)
    interpretation: RLVR "increases the likelihood of sampling correct responses at low k, but narrows the model's overall coverage"
    supported_claim: C1
  - id: E2
    research_question: RQ5 — does the finding generalize to code generation and visual reasoning?
    setup: Code-R1/DeepCoder GRPO on HumanEval+/MBPP/LiveCodeBench (Qwen2.5-7B-Instruct, DeepSeek-R1-Distill-Qwen-14B); EasyR1 GRPO on MathVista/MathVision (Qwen2.5-VL-7B) (§3.2–3.3, Table 1)
    baseline: base/instruct counterparts
    result: same pattern — base surpasses RL at large k (Figs. 3–4); code is robust to guessing concerns since unit tests verify
    interpretation: not a math-benchmark artifact
    supported_claim: C1
  - id: E3
    research_question: RQ3-mechanistic — why does RLVR appear to improve while narrowing coverage?
    setup: accuracy histograms (Minerva), 4-category solvable-set contingency on AIME24/MATH500 (k=1024/128), cross-model perplexity of base vs RL vs o1 responses sampled per problem (§4.1, Figs. 5–6, Tables 2, 5)
    baseline: base model's own distributions
    result: RLVR gains concentrated on already-solvable problems; near-subset relation (0.0% RL-only on AIME24); PPL_base(Y_RL) inside base's low-PPL tail and decreasing over training
    interpretation: sharpening, not expansion — "reasoning capacity of the trained model remains bounded by that of its base model"
    supported_claim: C2, C3
  - id: E4
    research_question: RQ2 — is the boundary-expansion failure an artifact of one algorithm?
    setup: controlled VeRL training of Qwen2.5-7B with PPO, GRPO, Reinforce++, RLOO, ReMax, DAPO on identical data; ΔSE vs base pass@256 (§4.3, Fig. 8)
    baseline: base model upper bound; each other
    result: algorithms cluster — ΔSE "shows only minor variation yet remains consistently large"
    interpretation: the limitation is paradigm-level, not algorithm-level
    supported_claim: C4
  - id: E5
    research_question: RQ4 — is there a mechanism that genuinely expands the boundary?
    setup: compare pass@k of DeepSeek-R1-Distill-Qwen-7B against base Qwen2.5-Math-7B, its RLVR variant (Oat-Zero), and Instruct baseline (§4.2, Fig. 7)
    baseline: base, instruct, RLVR
    result: distilled curve "consistently and significantly above" base at all k
    interpretation: new patterns can be injected via a stronger teacher's prior — separating distillation from RLVR
    supported_claim: C5

narrative:
  introduction_roles: [Context (reasoning LLMs, RLVR success), Existing belief (RL discovers new strategies — extrapolated from Atari/Go), Stakes (self-evolving LLMs), Question (boxed fundamental question), Method choice (pass@k rationale vs average metrics), Findings preview (four bolded bullets), Constructive close (needed RL paradigms)]
  introduction_move: quotes the community's belief almost as a theorem to be tested, then poses the disjunctive question verbatim in a displayed block; the intro's four bolded findings each carry the evidentiary verb of its section (observe/analyze/define/contrast), and the paper is honest that its claim is about "current" RLVR — leaving the RL ideal intact while indicting its instantiations
  related_work_strategy: positioned as the systematic version of scattered prior observations (Dang et al., DeepSeek-Math "limited in scope"), with coverage-vs-exploration literature in App. B (§6)
  method_strategy: metric-reframing-first — §2.2 spends a full subsection defending pass@k against Best-of-N/majority-voting alternatives and the guessing confound (manual CoT checks), because the entire argument hangs on the metric being the right probe of "potential"
  experiments_strategy: breadth before depth — cross-domain pass@k sweeps (§3) establish generality, then Deep Analysis (§4) drills into mechanism (histograms → contingency → perplexity), then controlled algorithm comparison (§4.3) and the distillation contrast (§4.2); the toy Figure 1 (search trees) makes the abstract claim visual upfront
  conclusion_strategy: restates the negative result with the hedge "current RLVR methods have not fully realized the potential", dedicates Discussion (§5) to two explanatory mechanisms and four concrete research directions, and closes with explicit limitations (proprietary models, fast-moving field) (§7)

reviewer_defense:
  strengths: multi-family/multi-domain/algorithm-controlled design; manual CoT verification defuses the guessing objection; the perplexity analysis converts a correlational pass@k finding into a distributional mechanism; Figure 1 gives an intuitive summary that matches the quantitative results
  vulnerabilities: proprietary frontier models untested (conceded §7); k=256/1024 is a proxy for an infinite-sample bound; zero-shot prompting of base models (deliberate, but arguably weakens base-model average performance and could be contested); the claim is about "current" methods, so it is time-indexed and falsifiable by the next algorithm generation
  anticipated_attacks: '"base model pass@k gains are lucky guesses" — preempted by manual CoT checks on borderline problems and by unit-test-verified code results (§2.2, §3.1); "few-shot prompting would change base model results" — preempted by deliberately matching prompts between base and RL models and arguing fairness (§3 Evaluation Protocol); "distillation is just CoT SFT" — framed via the prior-injection mechanism in Discussion 2, "training RL models from a distilled model may temporarily provide a beneficial solution" (§5)'

writing:
  paragraph_patterns: bolded finding-assertions as paragraph openers (four in intro, repeated in section heads); each analysis subsection ends with a "Summary." paragraph enumerating numbered observations (§4.1)
  transition_patterns: 'question-driven pivots ("This raises the natural question: Do all reasoning paths generated by RL-trained models already exist within the output distribution of their base models?" §4.1); §5 explicitly begins by referring back to §§3–4 findings'
  terminology_patterns: careful metric vocabulary — "coverage", "reasoning boundary", "sampling efficiency gap (ΔSE)" coined and defined with a directional reading ("Lower ΔSE is better"); hedged quantifiers throughout ("rarely", "current", "often") protecting the thesis from overclaiming
